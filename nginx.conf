# Deployment example: replace domain, certificate and /home/acs/AIFriends paths.
# Validate with nginx -t before applying. Run Django with DJANGO_DEBUG=false.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 768; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;
    server {
        listen 80;
        server_name app7804.acapp.acwing.com.cn;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name app7804.acapp.acwing.com.cn;
        ssl_certificate cert/acapp.pem;
        ssl_certificate_key cert/acapp.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        charset utf-8;
        client_max_body_size 12M;
        location /static/ { alias /home/acs/AIFriends/backend/staticfiles/; }
        location /media/ { alias /home/acs/AIFriends/backend/media/; }
        # Private audio must only use authenticated/signed Django endpoints.
        location /private_storage/ { return 404; }
        location ~ ^/api/user/account/(login|register)/$ {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/uwsgi_params;
            uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
            uwsgi_pass 127.0.0.1:8000;
            uwsgi_read_timeout 45s;
        }
        location /api/friend/message/chat/ {
            limit_req zone=api burst=50 nodelay;
            include /etc/nginx/uwsgi_params;
            uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
            uwsgi_pass 127.0.0.1:8000;
            uwsgi_buffering off;
            gzip off;
            uwsgi_read_timeout 180s;
            add_header X-Accel-Buffering no always;
        }
        location / {
            limit_req zone=api burst=50 nodelay;
            include /etc/nginx/uwsgi_params;
            uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
            uwsgi_pass 127.0.0.1:8000;
            uwsgi_read_timeout 180s;
        }
        # CORS is managed by Django's explicit origin allow-list.
    }
}
