name: ai-friends

x-backend: &backend
  image: ai-friends-backend:local
  build:
    context: .
    target: backend
  env_file:
    - backend/.env
  environment:
    DJANGO_DATA_DIR: /data
    # Defaults are local HTTP; docker/gateway.env selects shared HTTPS gateway mode.
    DJANGO_DEBUG: "${APP_DEBUG:-true}"
    DJANGO_TRUST_PROXY: "${APP_TRUST_PROXY:-false}"
    DJANGO_ALLOWED_HOSTS: "${APP_DOMAIN:-127.0.0.1,localhost}"
    DJANGO_CORS_ALLOWED_ORIGINS: "${APP_ORIGIN:-http://127.0.0.1:8080}"
    DJANGO_CSRF_TRUSTED_ORIGINS: "${APP_ORIGIN:-http://127.0.0.1:8080}"
    HEALTHCHECK_HOST: "${APP_DOMAIN:-localhost}"
  volumes:
    - app-data:/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  init:
    <<: *backend
    command: ["python", "/app/docker/initialize.py"]
    restart: "no"

  web:
    <<: *backend
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py", "web"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Only nginx is published to the host; Gunicorn remains on the internal network.
    expose:
      - "8000"

  worker:
    <<: *backend
    command: ["python", "manage.py", "run_jobs"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 180s
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: ai-friends-nginx:local
    build:
      context: .
      target: nginx
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-localhost}"
      HEALTHCHECK_HOST: "${APP_DOMAIN:-localhost}"
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    volumes:
      - app-data:/srv/data:ro
      - type: bind
        source: "${NGINX_TEMPLATE:-./docker/nginx.conf}"
        target: /etc/nginx/templates/default.conf.template
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"Host: $${HEALTHCHECK_HOST:-localhost}\" http://127.0.0.1/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
