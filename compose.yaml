name: ai-friends

x-backend: &backend
  image: ai-friends-backend:local
  build:
    context: .
    target: backend
  env_file:
    - backend/.env
  environment:
    DJANGO_DATA_DIR: /data
  volumes:
    - app-data:/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  init:
    <<: *backend
    command: ["python", "/app/docker/initialize.py"]
    restart: "no"

  web:
    <<: *backend
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py", "web"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Only nginx is published to the host; Gunicorn remains on the internal network.
    expose:
      - "8000"

  worker:
    <<: *backend
    command: ["python", "manage.py", "run_jobs"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 180s
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: ai-friends-nginx:local
    build:
      context: .
      target: nginx
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - app-data:/srv/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"Host: $${HEALTHCHECK_HOST:-localhost}\" http://127.0.0.1/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
