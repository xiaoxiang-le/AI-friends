# Local HTTP gateway. For production terminate TLS at a trusted outer proxy;
# do not enable DJANGO_TRUST_PROXY before replacing the header policy below.
# Refresh Docker service DNS when the backend container is recreated.
upstream django_backend {
    zone django_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server web:8000 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    location /static/ {
        alias /srv/data/staticfiles/;
        # ONNX Runtime imports .mjs modules; browsers require a JavaScript MIME.
        include /etc/nginx/mime.types;
        types { application/javascript mjs; }
    }
    location /media/ {
        alias /srv/data/media/;
        add_header X-Content-Type-Options nosniff always;
    }
    location /private_storage/ {
        return 404;
    }
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Do not trust client-supplied forwarding headers in the local gateway.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }
}
